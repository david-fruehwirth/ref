name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}

    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin

          - runner: macos-15-intel
            target: x86_64-apple-darwin

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Verify version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata \
            --no-deps \
            --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match Cargo version $CARGO_VERSION"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          ARCHIVE="ref-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"

          mkdir package
          cp target/release/ref package/ref

          tar -C package -czf "$ARCHIVE" ref

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ref-${{ matrix.target }}
          path: ref-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: david-fruehwirth/homebrew-ref
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM_ARCHIVE="ref-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
          INTEL_ARCHIVE="ref-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz"
          ARM_SHA256="$(grep "  $ARM_ARCHIVE$" artifacts/SHA256SUMS | cut -d ' ' -f 1)"
          INTEL_SHA256="$(grep "  $INTEL_ARCHIVE$" artifacts/SHA256SUMS | cut -d ' ' -f 1)"

          if [ -z "$ARM_SHA256" ] || [ -z "$INTEL_SHA256" ]; then
            echo "Could not find macOS checksums in artifacts/SHA256SUMS"
            exit 1
          fi

          cat > homebrew-tap/Formula/ref.rb <<EOF
          class Ref < Formula
            desc "Git-like reference manager for scientific writing"
            homepage "https://github.com/david-fruehwirth/ref"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/david-fruehwirth/ref/releases/download/${GITHUB_REF_NAME}/$ARM_ARCHIVE"
                sha256 "$ARM_SHA256"
              end

              on_intel do
                url "https://github.com/david-fruehwirth/ref/releases/download/${GITHUB_REF_NAME}/$INTEL_ARCHIVE"
                sha256 "$INTEL_SHA256"
              end
            end

            def install
              bin.install "ref"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ref --version")
            end
          end
          EOF

      - name: Publish Homebrew formula
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/ref.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date"
            exit 0
          fi

          git commit -m "ref ${GITHUB_REF_NAME#v}"
          git push
