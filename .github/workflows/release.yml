name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}

    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin

          - runner: macos-15-intel
            target: x86_64-apple-darwin

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Verify version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata \
            --no-deps \
            --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match Cargo version $CARGO_VERSION"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          ARCHIVE="ref-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"

          mkdir package
          cp target/release/ref package/ref

          tar -C package -czf "$ARCHIVE" ref

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ref-${{ matrix.target }}
          path: ref-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes
