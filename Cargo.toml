[package]
name = "ref"
version = "0.1.0"
edition = "2021"
description = "A Git-like, filesystem-native reference manager"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

